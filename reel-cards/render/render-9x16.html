<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"WS";src:url(fonts/work-sans-latin-500-normal.woff2) format("woff2");font-weight:500}
@font-face{font-family:"WS";src:url(fonts/work-sans-latin-600-normal.woff2) format("woff2");font-weight:600}
@font-face{font-family:"WS";src:url(fonts/work-sans-latin-700-normal.woff2) format("woff2");font-weight:700}
@font-face{font-family:"WS";src:url(fonts/work-sans-latin-800-normal.woff2) format("woff2");font-weight:800}
:root{--verde:#045034;--marron:#b77649;--beige:#f5e5d6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:"WS",sans-serif}
.scene{position:absolute;inset:0;overflow:hidden;will-change:mask-image,transform}
.layer{position:absolute;inset:0;background-size:cover;background-position:center;transform-origin:50% 55%}
.bg{filter:saturate(1.05) brightness(.6)}
.fg{filter:saturate(1.05) brightness(.6);z-index:3}
.card{position:absolute;left:242px;top:470px;width:597px;height:875px;border-radius:65px;overflow:hidden;
  box-shadow:0 38px 104px rgba(0,0,0,.5);display:flex;flex-direction:column;z-index:2}
.card .img{position:relative;flex:1;background-size:cover}
.card .img::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(2,30,20,0) 34%,rgba(2,38,25,.93) 92%)}
.card .base{background:rgba(2,38,25,.95);padding:18px 47px 42px}
.iso{position:absolute;top:38px;left:44px;width:84px;z-index:2}
.t{position:absolute;left:47px;right:38px;bottom:24px;z-index:2;font-weight:800;color:#fff;font-size:53px;line-height:1.04;letter-spacing:-.02em}
.meta{font-weight:600;color:var(--beige);font-size:22px;white-space:nowrap;display:flex;gap:16px;align-items:center}
.meta i{width:11px;height:11px;border-radius:50%;background:var(--marron);display:inline-block}
.ring{position:absolute;top:34px;right:34px;width:162px;height:162px;z-index:2}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:32px;color:#fff;text-shadow:0 0 15px rgba(0,0,0,.55);font-variant-numeric:tabular-nums}
.ring span small{font-size:19px;margin-left:1px}
.end{background:radial-gradient(120% 80% at 50% 40%,#0a6a46 0%,#045034 55%,#02311f 100%)}
.endc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:52px;color:#fff;padding-bottom:180px}
.endc img{width:390px}
.verbs{display:flex;gap:18px;font-weight:700;font-size:47px;color:var(--beige);letter-spacing:-.01em}
.verbs b{color:var(--marron);font-weight:700}
.url{font-weight:500;font-size:33px;letter-spacing:.06em;color:rgba(245,229,214,.85)}
</style></head>
<body><div id="stage"></div>
<script>
const W=1080,H=1920,D=2.0,TR=0.8,S=420,F=170,C=2*Math.PI*16;
// barrido diagonal con borde difuminado: el gradiente es perpendicular al borde
const ANG=Math.atan2(H,S), DEG=ANG*180/Math.PI, GL=W*Math.sin(ANG)+H*Math.cos(ANG);
const SC=[
 {c:"c1",pos:"45% 50%",b:"v_b1",pct:12,title:"Tu lugar, entre el lago y las sierras",meta:["Villa Carlos Paz","Valle de Punilla"]},
 {c:"c2",pos:"50% 40%",b:"v_b2",pct:25,title:"Invertí con visión local",meta:["Información concreta","Criterio"]},
 {c:"c3",pos:"50% 60%",b:"v_b3",pct:38,title:"Comprá el rincón donde tomarías unos mates",meta:["Casas","Departamentos"]},
 {c:"c4",pos:"50% 45%",b:"v_b4",pct:50,title:"Alquilá con quien te responde",meta:["Trato directo","Sin vueltas"]},
 {c:"c5",pos:"25% 55%",b:"v_b5",fg:"v_b5_fg",pct:63,title:"Viví a ritmo de sierra",meta:["Aire puro","Tiempo para vos"]},
 {c:"c6",pos:"60% 60%",b:"v_b6",fg:"v_b6_fg",pct:75,title:"Te acompañamos en cada paso",meta:["Cada etapa","Cada decisión"]},
 {c:"c7",pos:"50% 25%",b:"v_b7",pct:88,title:"Lo más importante siempre son las personas",meta:["Erich A. Ebert","+10 años"]},
 {c:"c8",pos:"50% 35%",b:"v_b8",pct:100,title:"El inicio de algo importante",meta:["Bienvenidos","A casa"]},
 {end:true}
];
const TOTAL=(SC.length-1)*D+2.8;
const st=document.getElementById("stage");
const ease=x=>-(Math.cos(Math.PI*x)-1)/2, eout=x=>1-Math.pow(1-x,3), cl=x=>Math.max(0,Math.min(1,x));
SC.forEach((s,i)=>{
  const el=document.createElement("div"); el.className="scene"+(s.end?" end":""); el.style.zIndex=i+1;
  if(s.end){
    el.innerHTML=`<div class="endc"><img src="assets/logo.svg"><div class="verbs"><span>Invertí</span><b>·</b><span>Comprá</span><b>·</b><span>Alquilá</span><b>·</b><span>Viví</span></div><div class="url">ebertprop.com.ar</div></div>`;
  } else {
    el.innerHTML=`<div class="layer bg" style="background-image:url(assets/${s.b}.jpg)"></div>
    <div class="card"><div class="img" style="background-image:url(assets/${s.c}.jpg);background-position:${s.pos}">
      <img class="iso" src="assets/iso.svg">
      <div class="ring"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="none" stroke="rgba(245,229,214,.25)" stroke-width="4"/><circle class="arc" cx="20" cy="20" r="16" fill="none" stroke="#b77649" stroke-width="4" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg><span><b class="n">0</b><small>%</small></span></div>
      <div class="t">${s.title}</div></div>
      <div class="base"><div class="meta">${s.meta[0]}<i></i>${s.meta[1]}</div></div></div>
    ${s.fg?`<div class="layer fg" style="background-image:url(assets/${s.fg}.png)"></div>`:""}`;
  }
  st.appendChild(el); s.el=el;
});
function startOf(i){return i*D-TR/2}
window.render=function(t){
  SC.forEach((s,i)=>{
    const a=startOf(i), nextA=startOf(i+1);
    const visible = i===0 ? t<nextA+TR : (t>=a && t<nextA+TR);
    s.el.style.display=visible?"block":"none"; if(!visible) return;
    // entrada (barrido diagonal) y salida (empuje)
    const pin = i===0?1:ease(cl((t-a)/TR));
    const pout = i<SC.length-1? ease(cl((t-nextA)/TR)) : 0;
    if(pin<1){const p=-F+pin*(GL+2*F); const m=`linear-gradient(${DEG}deg,#000 ${p-F}px,transparent ${p+F}px)`; s.el.style.webkitMaskImage=m; s.el.style.maskImage=m;}
    else {s.el.style.webkitMaskImage="none"; s.el.style.maskImage="none";}
    const tx=(1-pin)*-60 + pout*70;
    s.el.style.transform=`translateX(${tx}px)`;
    if(s.end){
      const k=t-i*D, logo=s.el.querySelector("img");
      const lp=eout(cl((k-0.05)/0.6)); logo.style.opacity=lp; logo.style.transform=`translateY(${(1-lp)*30}px) scale(${0.94+0.06*lp})`;
      s.el.querySelectorAll(".verbs > *").forEach((w,j)=>{const p=eout(cl((k-0.35-j*0.07)/0.4)); w.style.opacity=p; w.style.transform=`translateY(${(1-p)*18}px)`;});
      const up=eout(cl((k-1.0)/0.5)); const u=s.el.querySelector(".url"); u.style.opacity=up;
      return;
    }
    // zoom lento del fondo (y del primer plano, que queda pegado al fondo)
    const life=cl((t-a)/(D+TR)); const z=1.0+0.07*life;
    s.el.querySelectorAll(".layer").forEach(l=>l.style.transform=`scale(${z})`);
    const card=s.el.querySelector(".card"); card.style.transform=`translateY(${(1-pin)*30}px)`;
    // el anillo cuenta desde el porcentaje anterior
    const prev=i?SC[i-1].pct:0, cp=eout(cl((t-(i*D-0.1))/1.0)), v=prev+(s.pct-prev)*cp;
    s.el.querySelector(".arc").setAttribute("stroke-dashoffset",C*(1-v/100));
    s.el.querySelector(".n").textContent=Math.round(v);
  });
};
window.TOTAL=TOTAL;
window.ready=Promise.all([document.fonts.ready,...[...document.images].map(im=>im.decode().catch(()=>{})),
  ...SC.flatMap(s=>s.end?[]:[s.b,s.c].concat(s.fg?[s.fg]:[])).map(n=>new Promise(r=>{const im=new Image();im.onload=im.onerror=r;im.src=`assets/${n}.${n.includes("_fg")?"png":"jpg"}`}))]);
render(0);
</script></body></html>
